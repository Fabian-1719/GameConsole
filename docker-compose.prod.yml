name: gameconsole

services:
  # -------------------------------------------------------------
  # Caddy Reverse Proxy: HTTPS automático y WebSockets
  # -------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      console-web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # Overrides para producción: Cierre de puertos al exterior
  # -------------------------------------------------------------
  console-web:
    # El tráfico web entra exclusivamente a través de Caddy (puertos 80 y 443)
    ports: !reset []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  console-server:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prolog-ai:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gamestats-go:
    # Cerrar puertos directos de GameStats al exterior
    ports: !reset []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gamestats-scala:
    # Cerrar puertos directos de GameStats al exterior
    ports: !reset []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
