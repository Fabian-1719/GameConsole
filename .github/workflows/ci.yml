name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Pruebas, Lint y Build de TypeScript (Server y Web)
  # -------------------------------------------------------------
  console:
    name: Console (Server & Web)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            console-server/package-lock.json
            console-web/package-lock.json

      - name: Install dependencies (console-server)
        working-directory: console-server
        run: npm ci

      - name: Lint and typecheck (console-server)
        working-directory: console-server
        run: npm run lint

      - name: Run unit & integration tests (console-server)
        working-directory: console-server
        run: npm test

      - name: Build TypeScript (console-server)
        working-directory: console-server
        run: npm run build

      - name: Install dependencies (console-web)
        working-directory: console-web
        run: npm ci

      - name: Lint and typecheck (console-web)
        working-directory: console-web
        run: npm run lint

      - name: Run unit tests (console-web)
        working-directory: console-web
        run: npm test

      - name: Build frontend SPA (console-web)
        working-directory: console-web
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Pruebas plunit de Inteligencia Artificial (SWI-Prolog)
  # -------------------------------------------------------------
  prolog:
    name: Prolog AI (plunit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run plunit tests in official SWI-Prolog container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/prolog-ai:/app" \
            -w /app \
            swipl:9.2.5 \
            swipl -g "run_tests,halt" -s tests/connect4_tests.pl

  # -------------------------------------------------------------
  # Job 3: Construcción y Publicación de Imágenes en GHCR (Solo en main)
  # -------------------------------------------------------------
  images:
    name: Publish Images to GHCR
    needs: [console, prolog]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gameconsole-server
            context: ./console-server
            dockerfile: ./console-server/Dockerfile
          - image: gameconsole-web
            context: ./console-web
            dockerfile: ./console-web/Dockerfile
          - image: gameconsole-prolog
            context: ./prolog-ai
            dockerfile: ./prolog-ai/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and short SHA
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Smoke Test de Integración E2E (Compose + Prolog + GameStats)
  # -------------------------------------------------------------
  smoke:
    name: Smoke Test (Integration)
    needs: [console, prolog]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Log in to GHCR (para descargar imágenes de GameStats si son privadas)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure environment
        run: cp .env.example .env

      - name: Start Docker Compose infrastructure
        run: docker compose up -d --build

      - name: Wait for all services to become healthy
        timeout-minutes: 4
        run: |
          echo "Verificando estado de los contenedores..."
          for i in $(seq 1 40); do
            UNHEALTHY=$(docker compose ps --format json | jq -r 'select(.Health != "" and .Health != "healthy") | .Name')
            if [ -z "$UNHEALTHY" ]; then
              echo "Todos los servicios se encuentran en estado HEALTHY:"
              docker compose ps
              exit 0
            fi
            echo "Esperando servicios saludables ($i/40): $UNHEALTHY"
            sleep 3
          done
          echo "ERROR: Tiempo de espera agotado para salud de contenedores."
          docker compose ps
          docker compose logs
          exit 1

      - name: Run Smoke Test script
        run: node scripts/smoke-test.mjs

      - name: Output Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------
  # Job 5: Despliegue Automático (Deshabilitado hasta Fase 3)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Server
    needs: [images, smoke]
    # Se activará en Fase 3 cuando el servidor esté configurado
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder de despliegue (Fase 3)
        run: echo "El despliegue automático se activará en la Fase 3 tras configurar los secretos del VPS."
